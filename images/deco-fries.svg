<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150" width="120" height="150">
  <!-- fries sticking up -->
  <!-- fry 1 -->
  <rect x="28" y="18" width="11" height="58" rx="5" fill="#f9c02e" transform="rotate(-8 33 47)"/>
  <rect x="29" y="18" width="5" height="20" rx="3" fill="#ffd84d" opacity="0.7" transform="rotate(-8 33 47)"/>
  <!-- fry 2 -->
  <rect x="42" y="10" width="11" height="66" rx="5" fill="#f5b820"/>
  <rect x="43" y="10" width="5" height="22" rx="3" fill="#ffd84d" opacity="0.7"/>
  <!-- fry 3 -->
  <rect x="56" y="14" width="11" height="62" rx="5" fill="#f9c02e" transform="rotate(5 61 45)"/>
  <rect x="57" y="14" width="5" height="20" rx="3" fill="#ffd84d" opacity="0.7" transform="rotate(5 61 45)"/>
  <!-- fry 4 -->
  <rect x="70" y="20" width="11" height="56" rx="5" fill="#f5b820" transform="rotate(10 75 48)"/>
  <rect x="71" y="20" width="5" height="18" rx="3" fill="#ffd84d" opacity="0.7" transform="rotate(10 75 48)"/>
  <!-- fry 5 (short, behind) -->
  <rect x="50" y="28" width="9" height="44" rx="4" fill="#e8a800" transform="rotate(-4 54 50)"/>

  <!-- container body -->
  <path d="M18 72 L25 145 L95 145 L102 72 Z" fill="#c8102e"/>
  <!-- container highlight stripe -->
  <path d="M26 72 L32 138 L42 138 L36 72 Z" fill="#e8304a" opacity="0.5"/>
  <!-- container top fold -->
  <rect x="16" y="65" width="88" height="13" rx="4" fill="#a00020"/>
  <!-- container rim highlight -->
  <rect x="16" y="65" width="88" height="5" rx="3" fill="#d01030"/>

  <!-- Hello Kitty bow on container -->
  <ellipse cx="50" cy="68" rx="9" ry="6" fill="#ff6680" transform="rotate(-25 50 68)"/>
  <ellipse cx="50" cy="68" rx="6" ry="4" fill="#ffaaaa" transform="rotate(-25 50 68)"/>
  <ellipse cx="63" cy="68" rx="9" ry="6" fill="#ff6680" transform="rotate(25 63 68)"/>
  <ellipse cx="63" cy="68" rx="6" ry="4" fill="#ffaaaa" transform="rotate(25 63 68)"/>
  <ellipse cx="56" cy="69" rx="5" ry="4" fill="#e84060"/>
  <ellipse cx="56" cy="69" rx="3" ry="2.5" fill="#ff6680"/>

  <!-- spicy pepper flakes on fries -->
  <circle cx="36" cy="30" r="2.5" fill="#c8102e"/>
  <circle cx="55" cy="22" r="2" fill="#e03020"/>
  <circle cx="70" cy="35" r="2.5" fill="#c8102e"/>
  <circle cx="45" cy="40" r="1.8" fill="#e03020"/>
  <circle cx="62" cy="28" r="2" fill="#c8102e"/>
  <circle cx="32" cy="45" r="1.5" fill="#e03020"/>

  <!-- "SPICY" text on container -->
  <text x="56" y="118" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">SPICY</text>
  <text x="56" y="133" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#ffcccc" text-anchor="middle" letter-spacing="0.5">FRIES</text>
</svg>
